name: My First Workflow
on:
  push:
    branches:
      - master

env:
  APP_NAME: "This is a global variable"

jobs:
  hello-job:
    runs-on: ubuntu-latest
    env:
      JOB_NAME: "Job Variable"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
    
      - name: Show Global Variable
        run: echo "APP_NAME = $APP_NAME"

      - name: Show Job Variable
        run: echo "JOB_NAME = $JOB_NAME"

      - name: Show Files
        env:
          STEP_NAME: "Step Variable"
        run: echo "STEP_NAME = $STEP_NAME"
    