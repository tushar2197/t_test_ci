name: CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Frontend CI
        working-directory: ./web
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Upload Frontend Build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: ./web/.next
          include-hidden-files: true

  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Event Type
        run: echo "Event is ${{ github.event_name }}"

      - name: Push Only
        if: github.event_name == 'push'
        run: echo "This is a push to master"

      - name: Pull Request Only
        if: github.event_name == 'pull_request'
        run: echo "This is a Pull Request"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: back/package-lock.json

      - name: Backend CI
        working-directory: ./back
        run: |
          npm ci
          npm run lint
          npm test

  deploy:
    needs:
      - frontend
      - backend

    if: github.event_name == 'push'

    runs-on: ubuntu-latest

    environment: dev

    env:
      SERVER_HOST: ${{ vars.SERVER_HOST }}
      SERVER_USER: ${{ vars.SERVER_USER }}
      APP_NAME: ${{ vars.APP_NAME }}

    steps:
      - name: Download Frontend Build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: ./web/.next

      - name: Show Frontend Build
        run: ls -la ./web/.next

      - name: Check Deployment Configuration
        run: |
          if [ -n "$SERVER_HOST" ]; then
            echo "SERVER_HOST is set"
          else
            echo "SERVER_HOST is NOT set"
            exit 1
          fi

          if [ -n "$SERVER_USER" ]; then
            echo "SERVER_USER is set"
          else
            echo "SERVER_USER is NOT set"
            exit 1
          fi

          if [ -n "$APP_NAME" ]; then
            echo "APP_NAME is set"
          else
            echo "APP_NAME is NOT set"
            exit 1
          fi

      - name: Deployment Check
        run: echo "Frontend and Backend passed. Ready to deploy."
      - name: Download Frontend Build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: ./web/.next

      - name: Show Frontend Build
        run: ls -la ./web/.next

      - name: Deployment Check
        run: echo "Frontend and Backend passed. Ready to deploy."